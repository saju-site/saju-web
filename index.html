<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 사주 - 무료 만세력</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #f5f1e8;
    color: #333;
}

.container {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    color: #5b3a29;
    font-size: 32px;
}

.header p {
    color: #777;
    margin-top: 10px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

label {
    display: block;
    margin-top: 16px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 22px;
    border: 0;
    border-radius: 10px;
    background: #5b3a29;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    display: none;
    margin-top: 25px;
}

.result-title {
    text-align: center;
    color: #5b3a29;
}

.pillars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 20px;
}

.pillar {
    text-align: center;
    background: #faf7f0;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px 5px;
}

.pillar-title {
    font-size: 13px;
    color: #777;
}

.pillar-value {
    font-size: 20px;
    font-weight: bold;
    color: #5b3a29;
    margin-top: 8px;
}

.info {
    margin-top: 20px;
    padding: 18px;
    background: #faf7f0;
    border-radius: 12px;
    line-height: 1.7;
}

.notice {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 13px;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .card {
        padding: 18px;
    }

    .header h1 {
        font-size: 27px;
    }

    .pillars {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>오늘의 사주</h1>
        <p>무료 사주 만세력</p>
    </div>

    <div class="card">

        <label for="name">이름</label>
        <input
            type="text"
            id="name"
            placeholder="이름을 입력하세요"
        >

        <label for="birth">생년월일</label>
        <input
            type="date"
            id="birth"
        >

        <label for="hour">출생시간</label>
        <select id="hour">
            <option value="">출생시간 모름</option>
            <option value="23">23:00</option>
            <option value="0">00:00</option>
            <option value="1">01:00</option>
            <option value="2">02:00</option>
            <option value="3">03:00</option>
            <option value="4">04:00</option>
            <option value="5">05:00</option>
            <option value="6">06:00</option>
            <option value="7">07:00</option>
            <option value="8">08:00</option>
            <option value="9">09:00</option>
            <option value="10">10:00</option>
            <option value="11">11:00</option>
            <option value="12">12:00</option>
            <option value="13">13:00</option>
            <option value="14">14:00</option>
            <option value="15">15:00</option>
            <option value="16">16:00</option>
            <option value="17">17:00</option>
            <option value="18">18:00</option>
            <option value="19">19:00</option>
            <option value="20">20:00</option>
            <option value="21">21:00</option>
            <option value="22">22:00</option>
        </select>

        <label for="gender">성별</label>
        <select id="gender">
            <option value="male">남성</option>
            <option value="female">여성</option>
        </select>

        <button onclick="calculateSaju()">
            사주 확인하기
        </button>

        <div class="result" id="result">

            <h2 class="result-title" id="resultTitle">
                사주 결과
            </h2>

            <div class="pillars">

                <div class="pillar">
                    <div class="pillar-title">년주</div>
                    <div class="pillar-value" id="yearPillar">-</div>
                </div>

                <div class="pillar">
                    <div class="pillar-title">월주</div>
                    <div class="pillar-value" id="monthPillar">-</div>
                </div>

                <div class="pillar">
                    <div class="pillar-title">일주</div>
                    <div class="pillar-value" id="dayPillar">-</div>
                </div>

                <div class="pillar">
                    <div class="pillar-title">시주</div>
                    <div class="pillar-value" id="hourPillar">-</div>
                </div>

            </div>

            <div class="info" id="basicInfo"></div>

            <p class="notice">
                무료 기본 사주 서비스입니다.
            </p>

        </div>

    </div>

</div>

<script>

function calculateSaju() {

    const name =
        document.getElementById("name").value.trim();

    const birth =
        document.getElementById("birth").value;

    const hour =
        document.getElementById("hour").value;

    const gender =
        document.getElementById("gender").value;

    if (!birth) {
        alert("생년월일을 입력해주세요.");
        return;
    }

    const date = new Date(birth + "T12:00:00");

    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();

    const animalList = [
        "쥐",
        "소",
        "호랑이",
        "토끼",
        "용",
        "뱀",
        "말",
        "양",
        "원숭이",
        "닭",
        "개",
        "돼지"
    ];

    const animalIndex =
        ((year - 4) % 12 + 12) % 12;

    const animal =
        animalList[animalIndex];

    const genderText =
        gender === "male" ? "남성" : "여성";

    document.getElementById("resultTitle").textContent =
        (name || "회원") + "님의 사주";

    document.getElementById("yearPillar").textContent =
        year + "년";

    document.getElementById("monthPillar").textContent =
        month + "월";

    document.getElementById("dayPillar").textContent =
        day + "일";

    document.getElementById("hourPillar").textContent =
        hour === "" ? "모름" : hour + "시";

    document.getElementById("basicInfo").innerHTML =
        "<strong>기본 정보</strong><br>" +
        year + "년 " +
        animal + "띠 · " +
        genderText +
        "<br>생년월일: " +
        year + "년 " +
        month + "월 " +
        day + "일" +
        "<br>출생시간: " +
        (hour === "" ? "입력하지 않음" : hour + "시");

    document.getElementById("result").style.display =
        "block";
}

</script>

</body>
</html>
