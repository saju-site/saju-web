<script>
function showResult(){
 const name=document.getElementById('name').value || '회원';
 const birth=document.getElementById('birth').value;
 const time=document.getElementById('time').value || '출생시간 미상';
 const gender=document.getElementById('gender').value;

 if(!birth){
   alert('생년월일을 입력해주세요.');
   return;
 }

 document.getElementById('result').style.display='block';
 document.getElementById('result').innerHTML=
 `<h3>${name}님의 사주 입력 정보</h3>
 <p>생년월일: <b>${birth}</b></p>
 <p>출생시간: <b>${time}</b></p>
 <p>성별: <b>${gender}</b></p>
 <hr>
 <p>기본 사주 분석 기능을 준비 중입니다.</p>`;
}
</script>
</body>
</html>
