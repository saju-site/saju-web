<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 만세력</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;line-height:1.6;background:#f7f4ef;color:#333}
h1{text-align:center;color:#6b3f2a}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 2px 10px #ddd}
label{display:block;margin-top:14px;font-weight:bold}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:22px;background:#6b3f2a;color:white;border:0;cursor:pointer}
#result{margin-top:20px;padding:15px;background:#faf7f2;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>🔮 사주 만세력</h1>
<p>생년월일과 출생시간을 입력해 주세요.</p>

<label>이름</label>
<input id="name" type="text" placeholder="이름을 입력하세요">

<label>생년월일</label>
<input id="birth" type="date">

<label>출생시간</label>
<select id="time">
<option value="">모름</option>
<option>00:00 ~ 00:59</option><option>01:00 ~ 02:59</option>
<option>03:00 ~ 04:59</option><option>05:00 ~ 06:59</option>
<option>07:00 ~ 08:59</option><option>09:00 ~ 10:59</option>
<option>11:00 ~ 12:59</option><option>13:00 ~ 14:59</option>
<option>15:00 ~ 16:59</option><option>17:00 ~ 18:59</option>
<option>19:00 ~ 20:59</option><option>21:00 ~ 22:59</option>
</select>

<label>성별</label>
<select id="gender">
<option>남성</option><option>여성</option>
</select>

<button onclick="showResult()">사주 확인하기</button>
<div id="result"></div>
</div>

<script>
function showResult(){
 const name=document.getElementById('name').value || '회원';
 const birth=document.getElementById('birth').value;
 const time=document.getElementById('time').value || '출생시간 미상';
 const gender=document.getElementById('gender').value;
 if(!birth){alert('생년월일을 입력해주세요.');return;}
 document.getElementById('result').style.display='block';
 document.getElementById('result').innerHTML=
 `<h3>${name}님의 사주 입력 정보</h3>
 <p>생년월일: <b>${birth}</b></p>
 <p>출생시간: <b>${time}</b></p>
 <p>성별: <b>${gender}</b></p>
 <hr><p>오늘은 새로운 기회가 들어오는 날입니다.차분하게 판단하면 좋은 결과가 있습니다.</p>`;
}
</script>
</body>
</html>
